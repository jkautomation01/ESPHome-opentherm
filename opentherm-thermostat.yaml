# OpenTherm Thermostat — ESPHome firmware
#
# Hardware: DIYLESS OpenTherm Thermostat 1
#   https://diyless.com/product/opentherm-thermostat
#   WeMos D1 Mini ESP32 + Master OpenTherm Shield (no onboard display/buttons)
#
# Boiler: Intergas 28/24 cW4 (modulating condensing combi)
#
# Design:
#   Everything — the room-led control loop, the weather-compensation
#   bounds, and the condensing clamp — runs on this device. Home Assistant
#   is used only as a data source (it supplies the room and outdoor
#   temperature readings via the `homeassistant` sensor platform below);
#   no HA automation or blueprint is required for the thermostat to work.
#
#   Control strategy: a PID climate (`ch_climate`) targets your room
#   temperature — normal room-led thermostat behaviour, exposed to Home
#   Assistant as a native climate entity/card. Its output doesn't drive the
#   OpenTherm CH setpoint directly, though: it passes through a template
#   output (`ch_pid_scaling_output`) that, on every control cycle,
#   recomputes an outdoor-temperature-based ceiling for the flow setpoint
#   (a classic weather-compensation curve) and trims it down further if the
#   external CV return-line sensor shows the boiler isn't condensing. That
#   keeps a modulating condensing boiler like the Intergas cW4 running at
#   the lowest flow temperature the weather and the room both allow —
#   the single biggest lever for gas savings — while still responding to
#   actual room temperature like a normal thermostat.
#
#   Backup control (works without Home Assistant):
#     1. ESPHome's built-in web_server — a local web UI on the device's IP,
#        reachable from any browser on your LAN, including the thermostat
#        card, even if HA is down.
#     2. A physical push-button (optional, you wire it yourself) that
#        toggles the heating climate on/off directly on the device — no
#        WiFi, no HA, no cloud required.
#     3. An on-device watchdog: if the Home Assistant API connection drops
#        for longer than ha_disconnect_backup_delay, the device stops the
#        PID loop and forces a safe fixed CH setpoint so the house doesn't
#        go cold while you fix HA (the room/outdoor readings come from HA,
#        so the control loop can't run meaningfully without it anyway).
#
#   Optional extras, each behind its own switch (all default on):
#     - "Room Sensor Glitch Guard": rejects/holds implausibly fast room-
#       temperature jumps instead of reacting to them (equivalent to Nest's
#       Sunblock, generalized to any sensor glitch, not just direct sun).
#     - "Anticipate Heating Coast": eases the flow setpoint down early as
#       the room nears target, based on a learned heating rate, so
#       residual radiator/floor heat coasts the rest of the way instead of
#       overshooting (equivalent to Nest's True Radiant).
#     - "Preheat Schedule": up to 4 time-of-day target-temperature slots,
#       started early enough (based on the same learned heating rate) to
#       hit each slot's target right on time (equivalent to Nest's Time to
#       Temp / auto-schedule). Manual changes via the thermostat card are
#       respected until the next scheduled slot change.

substitutions:
  name: opentherm-thermostat
  friendly_name: "OpenTherm Thermostat"

  # OpenTherm master shield pins (fixed by the DIYLESS Thermostat 1 board —
  # do not change unless you're on different hardware)
  ot_in_pin: "21"
  ot_out_pin: "22"

  # 1-Wire bus for the external DS18B20 mounted on the CV return line.
  # Pin 14 is DIYLESS's documented 1-Wire pin for stacking with the Master
  # OpenTherm Shield on the WeMos D1 Mini ESP32.
  one_wire_pin: "D5"

  # Optional physical backup button (you wire a momentary switch to GND).
  # GPIO4 is free on the WeMos D1 Mini ESP32 after the shield uses 21/22/14
  # — double check against your board's silkscreen before wiring.
  backup_button_pin: "4"

  # Existing Home Assistant entities the on-device control loop reads.
  room_temperature_entity_id: "sensor.woonkamer_temperatuur"
  outdoor_temperature_entity_id: "sensor.opentherm_thermostat_outside_temperature"

  # Central heating (CH) flow setpoint range ever sent to the boiler.
  ch_min_setpoint: "20"
  ch_max_setpoint: "80"
  # Safe fallback CH setpoint used only by the HA-disconnect watchdog —
  # deliberately modest, not a design-day value.
  ch_fallback_setpoint: "45"

  # Domestic hot water (DHW) setpoint range/default for the cW4's instant DHW.
  dhw_min_setpoint: "30"
  dhw_max_setpoint: "65"
  dhw_default_setpoint: "60"

  # Weather-compensation curve: outdoor temperature -> allowed flow-setpoint
  # ceiling for the room PID loop. min_flow_temp is the constant floor
  # (always allowed, for maximum condensing efficiency at low demand).
  design_outdoor_temp: "-10"      # coldest outdoor temp you size for (NL design temp ~ -10°C)
  design_flow_temp: "65"          # flow ceiling at design_outdoor_temp
  heating_limit_outdoor_temp: "18"  # outdoor temp above which the ceiling drops to the floor
  min_flow_temp: "22"             # flow ceiling at/above heating_limit_outdoor_temp, and the hard floor

  # Condensing clamp, using the external CV return-line sensor. Below
  # condensing_threshold the boiler is condensing (recovering extra heat
  # from flue gas); if the return line runs hotter, the flow setpoint is
  # trimmed down by condensing_trim_step to push it back into range.
  condensing_threshold: "55"
  condensing_trim_step: "2"

  # Room-led PID gains. Defaults are DIYLESS's field-tested starting point
  # for this exact hardware/output combination — tune from here.
  pid_kp: "0.77"
  pid_ki: "0.0005"
  default_room_target: "20"
  room_min_temp: "12"
  room_max_temp: "24"

  # How long the Home Assistant API connection must be down before the
  # device stops the PID loop and engages its safe fallback CH setpoint.
  ha_disconnect_backup_delay: "15min"

  # Room Sensor Glitch Guard (Sunblock equivalent): a room-temperature
  # jump faster than this (°C per minute) is treated as implausible and
  # held at the last good value instead of being acted on.
  glitch_guard_max_rate_c_per_min: "1.0"

  # Anticipate Heating Coast (True Radiant equivalent): how many minutes
  # of "coast" (residual radiator/floor heat still warming the room after
  # the flow setpoint is eased down) to plan for. Raise substantially for
  # underfloor heating (try 20-30); lower for lightweight radiators.
  anticipatory_coast_minutes: "8"

  # Heating-rate learning: instead of one blended number, rates are learned
  # separately per outdoor-temperature bucket (heat loss — and so net
  # warming rate — varies with outdoor temp) and per phase ("bulk" warm-up
  # used by Preheat Schedule vs "creep" near-target used by Anticipate
  # Heating Coast). Each bucket/phase keeps its last heat_rate_history_depth
  # samples and is read back as their median, so one unusual day (a window
  # left open, guests, a door propped) can't permanently skew the estimate.
  # heat_rate_cells / heat_rate_array_size are derived values (2 phases x
  # heat_rate_outdoor_buckets, and cells x heat_rate_history_depth) used to
  # size the storage arrays below — if you change heat_rate_outdoor_buckets
  # or heat_rate_history_depth, update these two AND the matching
  # initial_value list on heat_rate_history/heat_rate_write_idx/
  # heat_rate_count in the globals: section to match.
  heat_rate_outdoor_buckets: "3"
  heat_rate_history_depth: "6"
  heat_rate_cells: "6"          # = 2 * heat_rate_outdoor_buckets
  heat_rate_array_size: "36"    # = heat_rate_cells * heat_rate_history_depth
  creep_phase_gap_threshold: "1.5"  # room-to-target gap (°C) below which a sample is "creep" rather than "bulk"

  # Preheat Schedule (Time to Temp equivalent). Local timezone for the
  # schedule clock, and up to 4 daily time-of-day target slots (24h
  # hour/minute). Edit these to match your routine; a slot's target stays
  # in effect until the next slot's (preheat-adjusted) start time.
  timezone: "Europe/Amsterdam"
  preheat_max_lead_minutes: "180"
  schedule_slot1_hour: "6"
  schedule_slot1_minute: "30"
  schedule_slot1_target: "20"
  schedule_slot2_hour: "9"
  schedule_slot2_minute: "0"
  schedule_slot2_target: "17"
  schedule_slot3_hour: "17"
  schedule_slot3_minute: "0"
  schedule_slot3_target: "20"
  schedule_slot4_hour: "22"
  schedule_slot4_minute: "30"
  schedule_slot4_target: "16"

  # Operation Mode (select entity: Normal/Eco/Away/Holiday). Eco/Away are
  # setbacks relative to whatever the target was in Normal mode; Holiday
  # is an absolute frost-protection-level target, independent of season,
  # and also turns Hot Water off (worth it for a multi-day absence, unlike
  # Eco/Away where DHW is on-demand and costs nothing left enabled).
  # Preheat Schedule only runs while Operation Mode is Normal.
  eco_setback: "2"
  away_setback: "4"
  holiday_target: "12"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

esp32:
  board: wemos_d1_mini32
  flash_size: 4MB
  framework:
    type: arduino

logger:
  level: INFO

api:
  encryption:
    key: !secret api_encryption_key
  on_client_connected:
    - script.stop: engage_backup_mode
    - globals.set:
        id: backup_mode_active
        value: "false"
    - lambda: |-
        id(ha_connected).publish_state(true);
        id(backup_mode_indicator).publish_state(false);
    - climate.control:
        id: ch_climate
        mode: "HEAT"
    - logger.log: "Home Assistant reconnected — resuming room-led control"
  on_client_disconnected:
    - lambda: id(ha_connected).publish_state(false);
    - logger.log:
        level: WARN
        format: "Home Assistant API disconnected — backup watchdog started (%s until fallback)"
        args: ['"${ha_disconnect_backup_delay}"']
    - script.execute: engage_backup_mode

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  ap:
    ssid: "${friendly_name} Fallback"
    password: !secret ap_fallback_password

captive_portal:

# Local backup control surface, including the thermostat card — usable
# from any browser on the LAN even when Home Assistant is unreachable.
web_server:
  version: 3

time:
  - platform: sntp
    id: sntp_time
    timezone: ${timezone}

globals:
  - id: backup_mode_active
    type: bool
    restore_value: false
    initial_value: "false"

  # Room Sensor Glitch Guard state
  - id: glitch_guard_last_value
    type: float
    restore_value: false
    initial_value: "NAN"
  - id: glitch_guard_last_time
    type: uint32_t
    restore_value: false
    initial_value: "0"

  # Heating-rate learning: previous room-temp sample (for computing each
  # new delta), and a history of the last heat_rate_history_depth samples
  # per (phase, outdoor bucket) cell, flattened into one array. Cell index
  # = phase * heat_rate_outdoor_buckets + bucket, phase 0 = bulk warm-up,
  # phase 1 = near-target creep. heat_rate_count tracks how many of each
  # cell's slots are filled (so lookups before a cell has 6 samples don't
  # read stale zeros); heat_rate_write_idx is each cell's next slot to
  # overwrite (a ring buffer per cell).
  - id: heating_rate_prev_room_temp
    type: float
    restore_value: false
    initial_value: "NAN"
  - id: heat_rate_history
    type: float[${heat_rate_array_size}]
    restore_value: true
    initial_value: '{0.05,0.05,0.05,0.05,0.05,0.05,0.05,0.05,0.05,0.05,0.05,0.05,0.05,0.05,0.05,0.05,0.05,0.05,0.05,0.05,0.05,0.05,0.05,0.05,0.05,0.05,0.05,0.05,0.05,0.05,0.05,0.05,0.05,0.05,0.05,0.05}'
  - id: heat_rate_write_idx
    type: int[${heat_rate_cells}]
    restore_value: true
    initial_value: '{0,0,0,0,0,0}'
  - id: heat_rate_count
    type: int[${heat_rate_cells}]
    restore_value: true
    initial_value: '{0,0,0,0,0,0}'

  # Preheat Schedule state: the effective (preheat-adjusted) start minute
  # of the last-applied slot, so re-applying the same slot every minute
  # doesn't fight a manual thermostat-card change mid-slot.
  - id: preheat_last_applied_effective_start
    type: int
    restore_value: false
    initial_value: "-1000000"

  # Operation Mode state: the target_temperature that was in effect the
  # last time mode was Normal (so Eco/Away/Holiday compute their setback
  # from that, and Normal can restore it), and whether DHW was on right
  # before entering Holiday (so leaving Holiday restores it correctly
  # instead of always forcing it back on).
  - id: mode_saved_target
    type: float
    restore_value: true
    initial_value: ${default_room_target}
  - id: dhw_was_on_before_holiday
    type: bool
    restore_value: true
    initial_value: "false"
  # Tracks the Operation Mode select's current option ourselves, since
  # id(operation_mode).state isn't available on the generated
  # template-select-with-set_action class. x (the newly-selected option)
  # inside set_action is fine to use directly; this global stands in for
  # "what it was before" wherever that's needed.
  - id: operation_mode_current
    type: std::string
    restore_value: true
    initial_value: '"Normal"'

interval:
  - interval: 60s
    then:
      - lambda: |-
          // Learn the room's heating rate while the boiler is actively
          // calling for heat, split by outdoor-temperature bucket and by
          // phase (bulk warm-up vs near-target creep), into a small
          // ring-buffer history per cell. Feeds the two features below.
          if (id(room_temperature).has_state()) {
            float room_temp = id(room_temperature).state;
            if (!isnan(id(heating_rate_prev_room_temp)) && id(ch_active).state) {
              float delta = room_temp - id(heating_rate_prev_room_temp);
              if (delta > 0 && delta < 0.5f) {
                float outdoor = id(outdoor_temperature).has_state()
                    ? id(outdoor_temperature).state
                    : (float) ${design_outdoor_temp};
                float bucket_width = ((float) ${heating_limit_outdoor_temp} - (float) ${design_outdoor_temp})
                    / (float) ${heat_rate_outdoor_buckets};
                int bucket = bucket_width > 0
                    ? (int) ((outdoor - (float) ${design_outdoor_temp}) / bucket_width)
                    : 0;
                if (bucket < 0) bucket = 0;
                if (bucket > ${heat_rate_outdoor_buckets} - 1) bucket = ${heat_rate_outdoor_buckets} - 1;

                float gap = id(ch_climate).target_temperature - room_temp;
                int phase = (gap < (float) ${creep_phase_gap_threshold}) ? 1 : 0;  // 0=bulk, 1=creep

                int cell = phase * ${heat_rate_outdoor_buckets} + bucket;
                int slot_idx = id(heat_rate_write_idx)[cell];
                id(heat_rate_history)[cell * ${heat_rate_history_depth} + slot_idx] = delta;
                id(heat_rate_write_idx)[cell] = (slot_idx + 1) % ${heat_rate_history_depth};
                if (id(heat_rate_count)[cell] < ${heat_rate_history_depth}) {
                  id(heat_rate_count)[cell] = id(heat_rate_count)[cell] + 1;
                }
              }
            }
            id(heating_rate_prev_room_temp) = room_temp;
          }
      - lambda: |-
          // Preheat Schedule: apply whichever of the 4 slots has the most
          // recent preheat-adjusted start time at or before now, but only
          // when the active slot actually changes — so a manual change on
          // the thermostat card is respected until the next slot change.
          // Only runs in Normal Operation Mode — Eco/Away/Holiday own the
          // target while active, and a schedule tick shouldn't silently
          // cancel a Holiday setting.
          if (!id(preheat_schedule_enabled).state) return;
          if (id(operation_mode_current) != "Normal") return;
          if (!id(sntp_time).now().is_valid()) return;

          auto now = id(sntp_time).now();
          int now_min = now.hour * 60 + now.minute;
          float room_temp = id(room_temperature).has_state()
              ? id(room_temperature).state
              : (float) ${default_room_target};

          // Bulk warm-up rate (phase 0) for the current outdoor bucket,
          // read back as the median of its history (see the ring-buffer
          // write logic in the previous lambda).
          float outdoor_now = id(outdoor_temperature).has_state()
              ? id(outdoor_temperature).state
              : (float) ${design_outdoor_temp};
          float hr_bucket_width = ((float) ${heating_limit_outdoor_temp} - (float) ${design_outdoor_temp})
              / (float) ${heat_rate_outdoor_buckets};
          int hr_bucket = hr_bucket_width > 0
              ? (int) ((outdoor_now - (float) ${design_outdoor_temp}) / hr_bucket_width)
              : 0;
          if (hr_bucket < 0) hr_bucket = 0;
          if (hr_bucket > ${heat_rate_outdoor_buckets} - 1) hr_bucket = ${heat_rate_outdoor_buckets} - 1;
          int hr_cell = 0 * ${heat_rate_outdoor_buckets} + hr_bucket;  // phase 0 = bulk
          int hr_n = id(heat_rate_count)[hr_cell];
          float rate;
          if (hr_n == 0) {
            rate = 0.05f;
          } else {
            float hr_samples[${heat_rate_history_depth}];
            for (int i = 0; i < hr_n; i++) {
              hr_samples[i] = id(heat_rate_history)[hr_cell * ${heat_rate_history_depth} + i];
            }
            for (int i = 1; i < hr_n; i++) {
              float key = hr_samples[i];
              int j = i - 1;
              while (j >= 0 && hr_samples[j] > key) { hr_samples[j + 1] = hr_samples[j]; j--; }
              hr_samples[j + 1] = key;
            }
            rate = hr_samples[hr_n / 2];
          }
          if (rate < 0.005f) rate = 0.005f;

          struct Slot { int start_min; float target; };
          Slot slots[4] = {
            {${schedule_slot1_hour} * 60 + ${schedule_slot1_minute}, ${schedule_slot1_target}},
            {${schedule_slot2_hour} * 60 + ${schedule_slot2_minute}, ${schedule_slot2_target}},
            {${schedule_slot3_hour} * 60 + ${schedule_slot3_minute}, ${schedule_slot3_target}},
            {${schedule_slot4_hour} * 60 + ${schedule_slot4_minute}, ${schedule_slot4_target}},
          };

          int best_effective_start = -1000000;
          float best_target = id(ch_climate).target_temperature;

          for (int i = 0; i < 4; i++) {
            float gap = slots[i].target - room_temp;
            float lead_min = gap > 0 ? (gap / rate) : 0;
            if (lead_min > (float) ${preheat_max_lead_minutes}) {
              lead_min = (float) ${preheat_max_lead_minutes};
            }
            int effective_start = slots[i].start_min - (int) lead_min;

            for (int offset = -1440; offset <= 0; offset += 1440) {
              int es = effective_start + offset;
              if (es <= now_min && es > best_effective_start) {
                best_effective_start = es;
                best_target = slots[i].target;
              }
            }
          }

          if (best_effective_start != id(preheat_last_applied_effective_start)) {
            id(preheat_last_applied_effective_start) = best_effective_start;
            auto call = id(ch_climate).make_call();
            call.set_target_temperature(best_target);
            call.perform();
            ESP_LOGI("preheat", "Schedule slot changed — target now %.1f°C", best_target);
          }

script:
  - id: engage_backup_mode
    then:
      - delay: ${ha_disconnect_backup_delay}
      - logger.log:
          level: WARN
          format: "Home Assistant still disconnected — stopping PID loop, engaging safe fallback CH setpoint (${ch_fallback_setpoint}°C)"
      - globals.set:
          id: backup_mode_active
          value: "true"
      - lambda: id(backup_mode_indicator).publish_state(true);
      - climate.control:
          id: ch_climate
          mode: "OFF"
      - switch.turn_on: ch_enable
      - output.set_level:
          id: ch_setpoint_output
          level: !lambda 'return (${ch_fallback_setpoint} - ${ch_min_setpoint}) / (${ch_max_setpoint} - ${ch_min_setpoint});'

# Enable OpenTherm communication with the boiler
# https://esphome.io/components/opentherm.html
opentherm:
  in_pin: ${ot_in_pin}
  out_pin: ${ot_out_pin}

switch:
  - platform: opentherm
    ch_enable:
      id: ch_enable
      name: "Central Heating"
      restore_mode: RESTORE_DEFAULT_OFF
    dhw_enable:
      id: dhw_enable
      name: "Hot Water"
      restore_mode: RESTORE_DEFAULT_OFF

  # Optional-feature toggles — flip any of these off to fall back to
  # plain room-led + weather-compensated control.
  - platform: template
    id: glitch_guard_enabled
    name: "Room Sensor Glitch Guard"
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
  - platform: template
    id: anticipatory_shutoff_enabled
    name: "Anticipate Heating Coast"
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
  - platform: template
    id: preheat_schedule_enabled
    name: "Preheat Schedule"
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON

# Operation Mode: Normal / Eco / Away / Holiday. Eco and Away are setbacks
# relative to whatever target_temperature was last in effect under Normal
# (captured into mode_saved_target so switching between special modes
# doesn't compound them); Holiday is a fixed frost-protection target and
# also parks Hot Water off for the duration. Preheat Schedule only runs
# while this is Normal — see the guard added to its lambda above.
select:
  - platform: template
    id: operation_mode
    name: "Operation Mode"
    optimistic: true
    restore_value: true
    initial_option: "Normal"
    options:
      - "Normal"
      - "Eco"
      - "Away"
      - "Holiday"
    set_action:
      - lambda: |-
          std::string prev = id(operation_mode_current);
          std::string next = x;
          if (prev == next) return;
          id(operation_mode_current) = next;

          if (prev == "Holiday" && next != "Holiday") {
            if (id(dhw_was_on_before_holiday)) {
              id(dhw_enable).turn_on();
            }
          }
          if (next == "Holiday" && prev != "Holiday") {
            id(dhw_was_on_before_holiday) = id(dhw_enable).state;
            id(dhw_enable).turn_off();
          }

          if (prev == "Normal" && next != "Normal") {
            id(mode_saved_target) = id(ch_climate).target_temperature;
          }

          float min_t = (float) ${room_min_temp};
          float max_t = (float) ${room_max_temp};

          if (next == "Normal") {
            if (id(preheat_schedule_enabled).state) {
              // Let the next 60s tick immediately reapply the currently
              // active schedule slot, rather than restoring a possibly
              // stale pre-mode value.
              id(preheat_last_applied_effective_start) = -1000000;
            } else {
              auto call = id(ch_climate).make_call();
              call.set_target_temperature(id(mode_saved_target));
              call.perform();
            }
          } else if (next == "Eco") {
            float t = std::max(min_t, std::min(max_t, id(mode_saved_target) - (float) ${eco_setback}));
            auto call = id(ch_climate).make_call();
            call.set_target_temperature(t);
            call.perform();
          } else if (next == "Away") {
            float t = std::max(min_t, std::min(max_t, id(mode_saved_target) - (float) ${away_setback}));
            auto call = id(ch_climate).make_call();
            call.set_target_temperature(t);
            call.perform();
          } else if (next == "Holiday") {
            float t = std::max(min_t, std::min(max_t, (float) ${holiday_target}));
            auto call = id(ch_climate).make_call();
            call.set_target_temperature(t);
            call.perform();
          }
          ESP_LOGI("mode", "Operation Mode changed: %s -> %s", prev.c_str(), next.c_str());

number:
  - platform: opentherm
    t_dhw_set:
      id: dhw_setpoint
      name: "Hot Water Setpoint"
      step: 1
      min_value: ${dhw_min_setpoint}
      max_value: ${dhw_max_setpoint}
      restore_value: true
      initial_value: ${dhw_default_setpoint}

output:
  # The actual OpenTherm CH setpoint actuator. Not exposed to Home
  # Assistant directly — everything writes to it through
  # ch_pid_scaling_output below, which applies the dynamic weather/
  # condensing bounds. min/max here are the full physical range; the
  # narrower day-to-day range comes from the scaling output.
  - platform: opentherm
    t_set:
      id: ch_setpoint_output
      min_value: ${ch_min_setpoint}
      max_value: ${ch_max_setpoint}
      zero_means_zero: true

  # Sits between the PID climate and the OpenTherm output. Takes the PID's
  # normalized 0..1 demand level and maps it into an outdoor-temperature-
  # bounded, condensing-clamped absolute flow setpoint each control cycle.
  - platform: template
    id: ch_pid_scaling_output
    type: float
    write_action:
      - lambda: |-
          float outdoor = id(outdoor_temperature).has_state()
              ? id(outdoor_temperature).state
              : (float) ${design_outdoor_temp};

          float span = (float) ${heating_limit_outdoor_temp} - (float) ${design_outdoor_temp};
          float ratio = (span != 0)
              ? ((float) ${heating_limit_outdoor_temp} - outdoor) / span
              : 0.0f;
          ratio = std::max(0.0f, std::min(1.0f, ratio));

          float floor = (float) ${min_flow_temp};
          float ceiling = floor + ratio * ((float) ${design_flow_temp} - floor);

          float target = floor + state * (ceiling - floor);

          // Anticipate Heating Coast (True Radiant equivalent): ease off
          // early as the room nears target, banking on residual radiator/
          // floor heat to coast the rest of the way, based on the
          // near-target "creep" rate (phase 1) learned for the current
          // outdoor bucket — reuses `outdoor` computed above.
          if (id(anticipatory_shutoff_enabled).state && id(room_temperature).has_state()) {
            float room_temp = id(room_temperature).state;
            float target_room = id(ch_climate).target_temperature;
            float gap = target_room - room_temp;

            float hr_bucket_width = ((float) ${heating_limit_outdoor_temp} - (float) ${design_outdoor_temp})
                / (float) ${heat_rate_outdoor_buckets};
            int hr_bucket = hr_bucket_width > 0
                ? (int) ((outdoor - (float) ${design_outdoor_temp}) / hr_bucket_width)
                : 0;
            if (hr_bucket < 0) hr_bucket = 0;
            if (hr_bucket > ${heat_rate_outdoor_buckets} - 1) hr_bucket = ${heat_rate_outdoor_buckets} - 1;
            int hr_cell = 1 * ${heat_rate_outdoor_buckets} + hr_bucket;  // phase 1 = creep
            int hr_n = id(heat_rate_count)[hr_cell];
            float creep_rate;
            if (hr_n == 0) {
              creep_rate = 0.05f;
            } else {
              float hr_samples[${heat_rate_history_depth}];
              for (int i = 0; i < hr_n; i++) {
                hr_samples[i] = id(heat_rate_history)[hr_cell * ${heat_rate_history_depth} + i];
              }
              for (int i = 1; i < hr_n; i++) {
                float key = hr_samples[i];
                int j = i - 1;
                while (j >= 0 && hr_samples[j] > key) { hr_samples[j + 1] = hr_samples[j]; j--; }
                hr_samples[j + 1] = key;
              }
              creep_rate = hr_samples[hr_n / 2];
            }
            if (creep_rate < 0.005f) creep_rate = 0.005f;

            float coast_window = creep_rate * (float) ${anticipatory_coast_minutes};
            if (gap > 0 && coast_window > 0.01f && gap <= coast_window) {
              float ease = gap / coast_window;
              target = floor + (target - floor) * ease;
            }
          }

          if (id(return_line_temperature).has_state() &&
              id(return_line_temperature).state > (float) ${condensing_threshold}) {
            target -= (float) ${condensing_trim_step};
            target = std::max(target, floor);
          }

          float level = (target - (float) ${ch_min_setpoint}) /
              ((float) ${ch_max_setpoint} - (float) ${ch_min_setpoint});
          level = std::max(0.0f, std::min(1.0f, level));
          id(ch_setpoint_output).set_level(level);

climate:
  - platform: pid
    id: ch_climate
    name: "Heating"
    sensor: room_temperature
    default_target_temperature: ${default_room_target}
    heat_output: ch_pid_scaling_output
    visual:
      min_temperature: ${room_min_temp}
      max_temperature: ${room_max_temp}
      temperature_step:
        target_temperature: 0.5
        current_temperature: 0.1
    control_parameters:
      kp: ${pid_kp}
      ki: ${pid_ki}
      kd: 0
      output_averaging_samples: 10
    deadband_parameters:
      threshold_high: 0.3
      threshold_low: -0.3
      kp_multiplier: 0
      ki_multiplier: 0.15
      kd_multiplier: 0
      deadband_output_averaging_samples: 15
    on_state:
      - if:
          condition:
            - lambda: "return id(ch_climate).mode == CLIMATE_MODE_OFF;"
          then:
            - switch.turn_off: ch_enable
          else:
            - switch.turn_on: ch_enable

binary_sensor:
  - platform: opentherm
    ch_active:
      id: ch_active
      name: "Heating Active"
    dhw_active:
      id: dhw_active
      name: "Hot Water Active"
    flame_on:
      id: flame_on
      name: "Flame On"
    fault_indication:
      id: fault_indication
      name: "Boiler Fault"
      entity_category: diagnostic
    diagnostic_indication:
      id: diagnostic_indication
      name: "Boiler Diagnostic"
      entity_category: diagnostic
    service_request:
      name: "Service Required"
      entity_category: diagnostic
    lockout_reset:
      name: "Lockout Reset"
      entity_category: diagnostic
    low_water_pressure:
      name: "Low Water Pressure Fault"
      entity_category: diagnostic
    flame_fault:
      name: "Flame Fault"
      entity_category: diagnostic
    air_pressure_fault:
      name: "Air Pressure Fault"
      entity_category: diagnostic
    water_over_temp:
      name: "Water Overtemperature"
      entity_category: diagnostic

  # Diagnostic indicator: is the boiler currently in its efficient
  # condensing range, based on the external return-line sensor?
  - platform: template
    name: "Condensing Mode Active"
    id: condensing_mode_active
    entity_category: diagnostic
    icon: mdi:leaf
    lambda: |-
      if (id(return_line_temperature).has_state()) {
        return id(return_line_temperature).state < ${condensing_threshold};
      } else {
        return {};
      }

  # Connectivity/backup-status visibility
  - platform: template
    name: "Home Assistant Connected"
    id: ha_connected
    entity_category: diagnostic
    device_class: connectivity
  - platform: template
    name: "Backup Mode Active"
    id: backup_mode_indicator
    entity_category: diagnostic
  - platform: template
    name: "Room Sensor Glitch Detected"
    id: room_sensor_glitch_indicator
    entity_category: diagnostic
    device_class: problem

  # Optional physical backup button — wire a momentary push-button between
  # this pin and GND. Press to toggle the heating climate on/off locally,
  # independent of WiFi/Home Assistant. Toggles climate mode (not the
  # switch directly) so it stays in sync with the PID loop's own on_state
  # handler above.
  - platform: gpio
    id: backup_button
    name: "Backup Heat Button"
    entity_category: diagnostic
    pin:
      number: ${backup_button_pin}
      mode:
        input: true
        pullup: true
      inverted: true
    on_press:
      - lambda: |-
          auto call = id(ch_climate).make_call();
          if (id(ch_climate).mode == CLIMATE_MODE_OFF) {
            call.set_mode(CLIMATE_MODE_HEAT);
          } else {
            call.set_mode(CLIMATE_MODE_OFF);
          }
          call.perform();
      - logger.log: "Backup heat button pressed — toggled heating climate locally"

  # Optional: window/door cutoff. Uncomment and set your entity ID to force
  # the heating climate off while open, and back to HEAT when it closes.
  # - platform: homeassistant
  #   id: window_open
  #   entity_id: binary_sensor.YOUR_WINDOW_SENSOR
  #   on_press:
  #     - climate.control:
  #         id: ch_climate
  #         mode: "OFF"
  #   on_release:
  #     - climate.control:
  #         id: ch_climate
  #         mode: "HEAT"

one_wire:
  - platform: gpio
    pin: ${one_wire_pin}

sensor:
  # Room temperature, imported live from your existing Home Assistant
  # sensor — this is what ch_climate (the PID loop) targets. Passed
  # through the Room Sensor Glitch Guard filter before anything else sees
  # it, so every downstream feature gets the cleaned-up value.
  - platform: homeassistant
    id: room_temperature
    entity_id: ${room_temperature_entity_id}
    filters:
      - lambda: |-
          if (!id(glitch_guard_enabled).state) {
            return x;
          }
          if (!isnan(id(glitch_guard_last_value))) {
            uint32_t now_ms = millis();
            float dt_min = (now_ms - id(glitch_guard_last_time)) / 60000.0f;
            if (dt_min > 0.01f) {
              float rate = fabs(x - id(glitch_guard_last_value)) / dt_min;
              if (rate > (float) ${glitch_guard_max_rate_c_per_min}) {
                ESP_LOGW("glitch_guard", "Rejected implausible room temperature jump: %.2f -> %.2f (%.2f C/min)",
                    id(glitch_guard_last_value), x, rate);
                id(room_sensor_glitch_indicator).publish_state(true);
                return id(glitch_guard_last_value);
              }
            }
          }
          id(glitch_guard_last_value) = x;
          id(glitch_guard_last_time) = millis();
          id(room_sensor_glitch_indicator).publish_state(false);
          return x;

  # Outdoor temperature, imported from Home Assistant (a weather
  # integration entity works fine) — drives the weather-compensation
  # ceiling in ch_pid_scaling_output above.
  - platform: homeassistant
    id: outdoor_temperature
    entity_id: ${outdoor_temperature_entity_id}

  # External sensor on the CV return line — the ground truth for whether
  # the boiler is actually condensing, used by ch_pid_scaling_output to
  # clamp the flow setpoint down when the return runs hot.
  - platform: dallas_temp
    id: return_line_temperature
    name: "CV Return Line Temperature"
    update_interval: 30s
    accuracy_decimals: 2
    filters:
      - sliding_window_moving_average:
          window_size: 5
          send_every: 2

  # OpenTherm sensors reported by the boiler
  # https://esphome.io/components/opentherm.html#sensor
  #
  # Trimmed after a capability-discovery pass (flashed with every sensor
  # key the ESPHome opentherm component supports, then checked against
  # live values): this component publishes whatever bytes come back
  # regardless of ACK vs NACK, so "0.0" alone isn't proof of anything —
  # each of these was checked for plausibility. Genuinely dead ones
  # removed: t_ret and t_exhaust (both 0.0 while the boiler was actively
  # firing with a real flow temp — a working sensor wouldn't read zero
  # mid-cycle), t_dhw2/t_flow_ch2/t_storage/t_collector (no second DHW
  # sensor, no CH2, no solar on this system), t_outside (-31°C in August —
  # garbage), max_t_set/_ub/_lb, t_dhw_set_ub/_lb, otc_hc_ratio_ub/_lb
  # (all setpoint-bound queries, all exactly 0), device_type/_id/_version/
  # opentherm_version_device (identification block, all 0), max_capacity/
  # min_mod_level/fan_speed/fan_speed_setpoint/flame_current (all 0),
  # oem_diagnostic_code (0, unlike oem_fault_code's plausible 255 "no
  # fault" sentinel), dhw_flow_rate/ch_pump_starts/ch_pump_operation_hours/
  # dhw_pump_valve_starts/_hours/dhw_burner_starts (all 0, despite sibling
  # counters below proving the boiler does support *some* counters — these
  # specific ones just aren't among them). Every binary_sensor capability/
  # status flag the discovery pass added was removed too: the "Slave
  # Configuration" (ID 3) flags came back reading "Hot Water Present: off"
  # — objectively wrong for a working combi — so nothing on that message
  # or the related "Remote" message can be trusted, and the few flags that
  # *were* reliably read (cooling/CH2/electricity production, all
  # correctly "off") describe capabilities this system doesn't have anyway.
  #
  # Kept: t_dhw currently reads 0 too, but DHW_TEMP is a core, near-
  # universal Data-ID and the cW4's sensor is likely just idle (no tap
  # open since the reflash) rather than unsupported — worth re-checking
  # while hot water is actually running before writing it off.
  - platform: opentherm
    t_boiler:
      name: "Boiler Flow Temperature"
    t_dhw:
      name: "Hot Water Temperature"
    rel_mod_level:
      name: "Boiler Relative Modulation Level"
    ch_pressure:
      name: "CH Water Pressure"
    oem_fault_code:
      name: "OEM Fault Code"
      entity_category: diagnostic

    # Confirmed genuinely supported by this boiler — real, plausible
    # counters, not NACK artifacts.
    burner_starts:
      name: "Burner Starts"
      entity_category: diagnostic
    burner_operation_hours:
      name: "Burner Operation Hours"
      entity_category: diagnostic
    dhw_burner_operation_hours:
      name: "Hot Water Burner Operation Hours"
      entity_category: diagnostic

  - platform: wifi_signal
    name: "WiFi Signal"
    entity_category: diagnostic
    update_interval: 60s

  - platform: uptime
    name: "Uptime"
    entity_category: diagnostic

  # The rate currently applicable for *today's* outdoor-temperature bucket
  # (median of its history) — what Preheat Schedule (bulk) and Anticipate
  # Heating Coast (creep) are actually using right now. Both duplicate the
  # bucket/median lookup used in the interval: and output: lambdas above;
  # see the comment on heat_rate_history in globals: for how it's stored.
  - platform: template
    name: "Learned Heating Rate (Bulk)"
    entity_category: diagnostic
    unit_of_measurement: "°C/h"
    accuracy_decimals: 2
    icon: mdi:chart-line
    update_interval: 300s
    lambda: |-
      float outdoor = id(outdoor_temperature).has_state()
          ? id(outdoor_temperature).state
          : (float) ${design_outdoor_temp};
      float bw = ((float) ${heating_limit_outdoor_temp} - (float) ${design_outdoor_temp})
          / (float) ${heat_rate_outdoor_buckets};
      int bucket = bw > 0 ? (int) ((outdoor - (float) ${design_outdoor_temp}) / bw) : 0;
      if (bucket < 0) bucket = 0;
      if (bucket > ${heat_rate_outdoor_buckets} - 1) bucket = ${heat_rate_outdoor_buckets} - 1;
      int cell = 0 * ${heat_rate_outdoor_buckets} + bucket;
      int n = id(heat_rate_count)[cell];
      if (n == 0) return 0.05f * 60.0f;
      float samples[${heat_rate_history_depth}];
      for (int i = 0; i < n; i++) samples[i] = id(heat_rate_history)[cell * ${heat_rate_history_depth} + i];
      for (int i = 1; i < n; i++) {
        float key = samples[i];
        int j = i - 1;
        while (j >= 0 && samples[j] > key) { samples[j + 1] = samples[j]; j--; }
        samples[j + 1] = key;
      }
      return samples[n / 2] * 60.0f;

  - platform: template
    name: "Learned Heating Rate (Creep)"
    entity_category: diagnostic
    unit_of_measurement: "°C/h"
    accuracy_decimals: 2
    icon: mdi:chart-line
    update_interval: 300s
    lambda: |-
      float outdoor = id(outdoor_temperature).has_state()
          ? id(outdoor_temperature).state
          : (float) ${design_outdoor_temp};
      float bw = ((float) ${heating_limit_outdoor_temp} - (float) ${design_outdoor_temp})
          / (float) ${heat_rate_outdoor_buckets};
      int bucket = bw > 0 ? (int) ((outdoor - (float) ${design_outdoor_temp}) / bw) : 0;
      if (bucket < 0) bucket = 0;
      if (bucket > ${heat_rate_outdoor_buckets} - 1) bucket = ${heat_rate_outdoor_buckets} - 1;
      int cell = 1 * ${heat_rate_outdoor_buckets} + bucket;
      int n = id(heat_rate_count)[cell];
      if (n == 0) return 0.05f * 60.0f;
      float samples[${heat_rate_history_depth}];
      for (int i = 0; i < n; i++) samples[i] = id(heat_rate_history)[cell * ${heat_rate_history_depth} + i];
      for (int i = 1; i < n; i++) {
        float key = samples[i];
        int j = i - 1;
        while (j >= 0 && samples[j] > key) { samples[j + 1] = samples[j]; j--; }
        samples[j + 1] = key;
      }
      return samples[n / 2] * 60.0f;

  # All 6 individual (phase, outdoor bucket) cells, for anyone who wants
  # to watch the learning converge rather than just trust it. Hardcoded to
  # bucket indices 0/1/2 (bucket 0 = coldest end, near design_outdoor_temp;
  # last bucket = mildest, near heating_limit_outdoor_temp) — valid as
  # long as heat_rate_outdoor_buckets stays at its default of 3. If you
  # raise it, add more of these; if you lower it below 3, delete the
  # extras. Disabled by default so they don't clutter a normal install —
  # enable from the entity's settings in Home Assistant.
  - platform: template
    name: "Heating Rate — Bulk, Bucket 1 (Coldest)"
    entity_category: diagnostic
    disabled_by_default: true
    unit_of_measurement: "°C/h"
    accuracy_decimals: 2
    icon: mdi:chart-line
    update_interval: 300s
    lambda: |-
      int cell = 0 * ${heat_rate_outdoor_buckets} + 0;
      int n = id(heat_rate_count)[cell];
      if (n == 0) return 0.05f * 60.0f;
      float samples[${heat_rate_history_depth}];
      for (int i = 0; i < n; i++) samples[i] = id(heat_rate_history)[cell * ${heat_rate_history_depth} + i];
      for (int i = 1; i < n; i++) {
        float key = samples[i];
        int j = i - 1;
        while (j >= 0 && samples[j] > key) { samples[j + 1] = samples[j]; j--; }
        samples[j + 1] = key;
      }
      return samples[n / 2] * 60.0f;

  - platform: template
    name: "Heating Rate — Bulk, Bucket 2"
    entity_category: diagnostic
    disabled_by_default: true
    unit_of_measurement: "°C/h"
    accuracy_decimals: 2
    icon: mdi:chart-line
    update_interval: 300s
    lambda: |-
      int cell = 0 * ${heat_rate_outdoor_buckets} + 1;
      int n = id(heat_rate_count)[cell];
      if (n == 0) return 0.05f * 60.0f;
      float samples[${heat_rate_history_depth}];
      for (int i = 0; i < n; i++) samples[i] = id(heat_rate_history)[cell * ${heat_rate_history_depth} + i];
      for (int i = 1; i < n; i++) {
        float key = samples[i];
        int j = i - 1;
        while (j >= 0 && samples[j] > key) { samples[j + 1] = samples[j]; j--; }
        samples[j + 1] = key;
      }
      return samples[n / 2] * 60.0f;

  - platform: template
    name: "Heating Rate — Bulk, Bucket 3 (Mildest)"
    entity_category: diagnostic
    disabled_by_default: true
    unit_of_measurement: "°C/h"
