# OpenTherm Thermostat — ESPHome firmware
#
# Hardware: DIYLESS OpenTherm Thermostat 1
#   https://diyless.com/product/opentherm-thermostat
#   WeMos D1 Mini ESP32 + Master OpenTherm Shield (no onboard display/buttons)
#
# Boiler: Intergas 28/24 cW4 (modulating condensing combi)
#
# Design:
#   Everything — the room-led control loop, the weather-compensation
#   bounds, and the condensing clamp — runs on this device. Home Assistant
#   is used only as a data source (it supplies the room and outdoor
#   temperature readings via the `homeassistant` sensor platform below);
#   no HA automation or blueprint is required for the thermostat to work.
#
#   Control strategy: a PID climate (`ch_climate`) targets your room
#   temperature — normal room-led thermostat behaviour, exposed to Home
#   Assistant as a native climate entity/card. Its output doesn't drive the
#   OpenTherm CH setpoint directly, though: it passes through a template
#   output (`ch_pid_scaling_output`) that, on every control cycle,
#   recomputes an outdoor-temperature-based ceiling for the flow setpoint
#   (a classic weather-compensation curve) and trims it down further if the
#   external CV return-line sensor shows the boiler isn't condensing. That
#   keeps a modulating condensing boiler like the Intergas cW4 running at
#   the lowest flow temperature the weather and the room both allow —
#   the single biggest lever for gas savings — while still responding to
#   actual room temperature like a normal thermostat.
#
#   Backup control (works without Home Assistant):
#     1. ESPHome's built-in web_server — a local web UI on the device's IP,
#        reachable from any browser on your LAN, including the thermostat
#        card, even if HA is down.
#     2. A physical push-button (optional, you wire it yourself) that
#        toggles the heating climate on/off directly on the device — no
#        WiFi, no HA, no cloud required.
#     3. An on-device watchdog: if the Home Assistant API connection drops
#        for longer than ha_disconnect_backup_delay, the device stops the
#        PID loop and forces a safe fixed CH setpoint so the house doesn't
#        go cold while you fix HA (the room/outdoor readings come from HA,
#        so the control loop can't run meaningfully without it anyway).

substitutions:
  name: opentherm-thermostat
  friendly_name: "OpenTherm Thermostat"

  # OpenTherm master shield pins (fixed by the DIYLESS Thermostat 1 board —
  # do not change unless you're on different hardware)
  ot_in_pin: "21"
  ot_out_pin: "22"

  # 1-Wire bus for the external DS18B20 mounted on the CV return line.
  # Pin 14 is DIYLESS's documented 1-Wire pin for stacking with the Master
  # OpenTherm Shield on the WeMos D1 Mini ESP32.
  one_wire_pin: "14"

  # Optional physical backup button (you wire a momentary switch to GND).
  # GPIO4 is free on the WeMos D1 Mini ESP32 after the shield uses 21/22/14
  # — double check against your board's silkscreen before wiring.
  backup_button_pin: "4"

  # Existing Home Assistant entities the on-device control loop reads.
  # REPLACE these with your actual entity IDs before flashing.
  room_temperature_entity_id: "sensor.YOUR_ROOM_TEMPERATURE_SENSOR"
  outdoor_temperature_entity_id: "sensor.YOUR_OUTDOOR_TEMPERATURE_SENSOR"

  # Central heating (CH) flow setpoint range ever sent to the boiler.
  ch_min_setpoint: "20"
  ch_max_setpoint: "80"
  # Safe fallback CH setpoint used only by the HA-disconnect watchdog —
  # deliberately modest, not a design-day value.
  ch_fallback_setpoint: "45"

  # Domestic hot water (DHW) setpoint range/default for the cW4's instant DHW.
  dhw_min_setpoint: "30"
  dhw_max_setpoint: "65"
  dhw_default_setpoint: "60"

  # Weather-compensation curve: outdoor temperature -> allowed flow-setpoint
  # ceiling for the room PID loop. min_flow_temp is the constant floor
  # (always allowed, for maximum condensing efficiency at low demand).
  design_outdoor_temp: "-10"      # coldest outdoor temp you size for (NL design temp ~ -10°C)
  design_flow_temp: "65"          # flow ceiling at design_outdoor_temp
  heating_limit_outdoor_temp: "18"  # outdoor temp above which the ceiling drops to the floor
  min_flow_temp: "22"             # flow ceiling at/above heating_limit_outdoor_temp, and the hard floor

  # Condensing clamp, using the external CV return-line sensor. Below
  # condensing_threshold the boiler is condensing (recovering extra heat
  # from flue gas); if the return line runs hotter, the flow setpoint is
  # trimmed down by condensing_trim_step to push it back into range.
  condensing_threshold: "55"
  condensing_trim_step: "2"

  # Room-led PID gains. Defaults are DIYLESS's field-tested starting point
  # for this exact hardware/output combination — tune from here.
  pid_kp: "0.77"
  pid_ki: "0.0005"
  default_room_target: "20"
  room_min_temp: "12"
  room_max_temp: "24"

  # How long the Home Assistant API connection must be down before the
  # device stops the PID loop and engages its safe fallback CH setpoint.
  ha_disconnect_backup_delay: "15min"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

esp32:
  board: esp32dev
  framework:
    type: arduino

logger:
  level: INFO

api:
  encryption:
    key: !secret api_encryption_key
  on_client_connected:
    - script.stop: engage_backup_mode
    - globals.set:
        id: backup_mode_active
        value: "false"
    - lambda: |-
        id(ha_connected).publish_state(true);
        id(backup_mode_indicator).publish_state(false);
    - climate.control:
        id: ch_climate
        mode: "HEAT"
    - logger.log: "Home Assistant reconnected — resuming room-led control"
  on_client_disconnected:
    - lambda: id(ha_connected).publish_state(false);
    - logger.log:
        level: WARN
        format: "Home Assistant API disconnected — backup watchdog started (%s until fallback)"
        args: ['"${ha_disconnect_backup_delay}"']
    - script.execute: engage_backup_mode

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  ap:
    ssid: "${friendly_name} Fallback"
    password: !secret ap_fallback_password

captive_portal:

# Local backup control surface, including the thermostat card — usable
# from any browser on the LAN even when Home Assistant is unreachable.
web_server:
  version: 3

globals:
  - id: backup_mode_active
    type: bool
    restore_value: false
    initial_value: "false"

script:
  - id: engage_backup_mode
    then:
      - delay: ${ha_disconnect_backup_delay}
      - logger.log:
          level: WARN
          format: "Home Assistant still disconnected — stopping PID loop, engaging safe fallback CH setpoint (${ch_fallback_setpoint}°C)"
      - globals.set:
          id: backup_mode_active
          value: "true"
      - lambda: id(backup_mode_indicator).publish_state(true);
      - climate.control:
          id: ch_climate
          mode: "OFF"
      - switch.turn_on: ch_enable
      - output.set_level:
          id: ch_setpoint_output
          level: !lambda 'return (${ch_fallback_setpoint} - ${ch_min_setpoint}) / (${ch_max_setpoint} - ${ch_min_setpoint});'

# Enable OpenTherm communication with the boiler
# https://esphome.io/components/opentherm.html
opentherm:
  in_pin: ${ot_in_pin}
  out_pin: ${ot_out_pin}

switch:
  - platform: opentherm
    ch_enable:
      id: ch_enable
      name: "Central Heating"
      restore_mode: RESTORE_DEFAULT_OFF
    dhw_enable:
      id: dhw_enable
      name: "Hot Water"
      restore_mode: RESTORE_DEFAULT_OFF

number:
  - platform: opentherm
    t_dhw_set:
      id: dhw_setpoint
      name: "Hot Water Setpoint"
      step: 1
      min_value: ${dhw_min_setpoint}
      max_value: ${dhw_max_setpoint}
      restore_value: true
      initial_value: ${dhw_default_setpoint}

output:
  # The actual OpenTherm CH setpoint actuator. Not exposed to Home
  # Assistant directly — everything writes to it through
  # ch_pid_scaling_output below, which applies the dynamic weather/
  # condensing bounds. min/max here are the full physical range; the
  # narrower day-to-day range comes from the scaling output.
  - platform: opentherm
    t_set:
      id: ch_setpoint_output
      min_value: ${ch_min_setpoint}
      max_value: ${ch_max_setpoint}
      zero_means_zero: true

  # Sits between the PID climate and the OpenTherm output. Takes the PID's
  # normalized 0..1 demand level and maps it into an outdoor-temperature-
  # bounded, condensing-clamped absolute flow setpoint each control cycle.
  - platform: template
    id: ch_pid_scaling_output
    type: float
    write_action:
      - lambda: |-
          float outdoor = id(outdoor_temperature).has_state()
              ? id(outdoor_temperature).state
              : (float) ${design_outdoor_temp};

          float span = (float) ${heating_limit_outdoor_temp} - (float) ${design_outdoor_temp};
          float ratio = (span != 0)
              ? ((float) ${heating_limit_outdoor_temp} - outdoor) / span
              : 0.0f;
          ratio = std::max(0.0f, std::min(1.0f, ratio));

          float floor = (float) ${min_flow_temp};
          float ceiling = floor + ratio * ((float) ${design_flow_temp} - floor);

          float target = floor + state * (ceiling - floor);

          if (id(return_line_temperature).has_state() &&
              id(return_line_temperature).state > (float) ${condensing_threshold}) {
            target -= (float) ${condensing_trim_step};
            target = std::max(target, floor);
          }

          float level = (target - (float) ${ch_min_setpoint}) /
              ((float) ${ch_max_setpoint} - (float) ${ch_min_setpoint});
          level = std::max(0.0f, std::min(1.0f, level));
          id(ch_setpoint_output).set_level(level);

climate:
  - platform: pid
    id: ch_climate
    name: "Heating"
    sensor: room_temperature
    default_target_temperature: ${default_room_target}
    heat_output: ch_pid_scaling_output
    visual:
      min_temperature: ${room_min_temp}
      max_temperature: ${room_max_temp}
      temperature_step:
        target_temperature: 0.5
        current_temperature: 0.1
    control_parameters:
      kp: ${pid_kp}
      ki: ${pid_ki}
      kd: 0
      output_averaging_samples: 10
    deadband_parameters:
      threshold_high: 0.3
      threshold_low: -0.3
      kp_multiplier: 0
      ki_multiplier: 0.15
      kd_multiplier: 0
      deadband_output_averaging_samples: 15
    on_state:
      - if:
          condition:
            - lambda: "return id(ch_climate).mode == CLIMATE_MODE_OFF;"
          then:
            - switch.turn_off: ch_enable
          else:
            - switch.turn_on: ch_enable

binary_sensor:
  - platform: opentherm
    ch_active:
      id: ch_active
      name: "Heating Active"
    dhw_active:
      id: dhw_active
      name: "Hot Water Active"
    flame_on:
      id: flame_on
      name: "Flame On"
    fault_indication:
      id: fault_indication
      name: "Boiler Fault"
      entity_category: diagnostic
    diagnostic_indication:
      id: diagnostic_indication
      name: "Boiler Diagnostic"
      entity_category: diagnostic
    service_request:
      name: "Service Required"
      entity_category: diagnostic
    lockout_reset:
      name: "Lockout Reset"
      entity_category: diagnostic
    low_water_pressure:
      name: "Low Water Pressure Fault"
      entity_category: diagnostic
    flame_fault:
      name: "Flame Fault"
      entity_category: diagnostic
    air_pressure_fault:
      name: "Air Pressure Fault"
      entity_category: diagnostic
    water_over_temp:
      name: "Water Overtemperature"
      entity_category: diagnostic

  # Diagnostic indicator: is the boiler currently in its efficient
  # condensing range, based on the external return-line sensor?
  - platform: template
    name: "Condensing Mode Active"
    id: condensing_mode_active
    entity_category: diagnostic
    icon: mdi:leaf
    lambda: |-
      if (id(return_line_temperature).has_state()) {
        return id(return_line_temperature).state < ${condensing_threshold};
      } else {
        return {};
      }

  # Connectivity/backup-status visibility
  - platform: template
    name: "Home Assistant Connected"
    id: ha_connected
    entity_category: diagnostic
    device_class: connectivity
  - platform: template
    name: "Backup Mode Active"
    id: backup_mode_indicator
    entity_category: diagnostic

  # Optional physical backup button — wire a momentary push-button between
  # this pin and GND. Press to toggle the heating climate on/off locally,
  # independent of WiFi/Home Assistant. Toggles climate mode (not the
  # switch directly) so it stays in sync with the PID loop's own on_state
  # handler above.
  - platform: gpio
    id: backup_button
    name: "Backup Heat Button"
    entity_category: diagnostic
    pin:
      number: ${backup_button_pin}
      mode:
        input: true
        pullup: true
      inverted: true
    on_press:
      - lambda: |-
          auto call = id(ch_climate).make_call();
          if (id(ch_climate).mode == CLIMATE_MODE_OFF) {
            call.set_mode(CLIMATE_MODE_HEAT);
          } else {
            call.set_mode(CLIMATE_MODE_OFF);
          }
          call.perform();
      - logger.log: "Backup heat button pressed — toggled heating climate locally"

  # Optional: window/door cutoff. Uncomment and set your entity ID to force
  # the heating climate off while open, and back to HEAT when it closes.
  # - platform: homeassistant
  #   id: window_open
  #   entity_id: binary_sensor.YOUR_WINDOW_SENSOR
  #   on_press:
  #     - climate.control:
  #         id: ch_climate
  #         mode: "OFF"
  #   on_release:
  #     - climate.control:
  #         id: ch_climate
  #         mode: "HEAT"

one_wire:
  - platform: gpio
    pin: ${one_wire_pin}

sensor:
  # Room temperature, imported live from your existing Home Assistant
  # sensor — this is what ch_climate (the PID loop) targets.
  - platform: homeassistant
    id: room_temperature
    entity_id: ${room_temperature_entity_id}

  # Outdoor temperature, imported from Home Assistant (a weather
  # integration entity works fine) — drives the weather-compensation
  # ceiling in ch_pid_scaling_output above.
  - platform: homeassistant
    id: outdoor_temperature
    entity_id: ${outdoor_temperature_entity_id}

  # External sensor on the CV return line — the ground truth for whether
  # the boiler is actually condensing, used by ch_pid_scaling_output to
  # clamp the flow setpoint down when the return runs hot.
  - platform: dallas_temp
    id: return_line_temperature
    name: "CV Return Line Temperature"
    update_interval: 30s
    accuracy_decimals: 2
    filters:
      - sliding_window_moving_average:
          window_size: 5
          send_every: 2

  # OpenTherm sensors reported by the boiler
  # https://esphome.io/components/opentherm.html#sensor
  - platform: opentherm
    t_boiler:
      name: "Boiler Flow Temperature"
    t_dhw:
      name: "Hot Water Temperature"
    t_dhw2:
      name: "Hot Water Temperature 2"
    t_ret:
      name: "Return Water Temperature (Boiler Reported)"
    rel_mod_level:
      name: "Boiler Relative Modulation Level"
    max_t_set:
      name: "Max CH Setpoint"
      entity_category: diagnostic
    max_t_set_ub:
      name: "Upper Bound of CH Setpoint"
      entity_category: diagnostic
    max_t_set_lb:
      name: "Lower Bound of CH Setpoint"
      entity_category: diagnostic
    t_exhaust:
      name: "Boiler Exhaust Temperature"
      entity_category: diagnostic
    ch_pressure:
      name: "CH Water Pressure"
      entity_category: diagnostic
    oem_fault_code:
      name: "OEM Fault Code"
      entity_category: diagnostic
    oem_diagnostic_code:
      name: "OEM Diagnostic Code"
      entity_category: diagnostic

  - platform: wifi_signal
    name: "WiFi Signal"
    entity_category: diagnostic
    update_interval: 60s

  - platform: uptime
    name: "Uptime"
    entity_category: diagnostic

text_sensor:
  - platform: wifi_info
    ip_address:
      name: "IP Address"
      entity_category: diagnostic

button:
  - platform: restart
    name: "Restart"
    entity_category: diagnostic
