# Example Lovelace view for the OpenTherm thermostat.
# Replace the entity IDs with your actual device's entity IDs (they'll be
# prefixed with the device name you set in opentherm-thermostat.yaml, e.g.
# "opentherm_thermostat_...").
#
# Add as a new dashboard view, or paste the cards into an existing dashboard
# in YAML mode.
#
# If you ever renamed the device (changed `name:`/`friendly_name:` and
# reflashed), don't assume every entity picked up the new prefix — Home
# Assistant keeps an entity's original ID stable once created. Check your
# actual entity IDs (Developer Tools → States, or the device page) rather
# than trusting this file's naming pattern blindly.

title: OpenTherm
views:
  - title: Heating
    path: opentherm
    cards:
      # Custom card — see home_assistant/README.md "Custom Lovelace Card"
      # for install steps (copy the .js into www/, add it as a resource).
      # Falls back to the built-in `thermostat` card, commented below, if
      # you'd rather not install a custom resource.
      - type: custom:opentherm-thermostat-card
        climate_entity: climate.opentherm_thermostat_heating
        mode_select_entity: select.opentherm_thermostat_operation_mode
        dhw_switch_entity: switch.opentherm_thermostat_hot_water
        dhw_setpoint_entity: number.opentherm_thermostat_hot_water_setpoint
        dhw_active_entity: binary_sensor.opentherm_thermostat_hot_water_active
        flame_entity: binary_sensor.opentherm_thermostat_flame_on
        condensing_entity: binary_sensor.opentherm_thermostat_condensing_mode_active
        connected_entity: binary_sensor.opentherm_thermostat_home_assistant_connected
        backup_mode_entity: binary_sensor.opentherm_thermostat_backup_mode_active

      # - type: thermostat
      #   entity: climate.opentherm_thermostat_heating

      # Smart Schedule card — see the "Smart Schedule" section in the main
      # README, and home_assistant/custom_components/opentherm_schedule/,
      # for what this drives. Same install steps as the card above (copy
      # the .js into www/, add it as a resource).
      - type: custom:opentherm-schedule-card
        entity: opentherm_schedule.heating_comfort

      - type: entities
        title: Hot water
        entities:
          - entity: switch.opentherm_thermostat_hot_water
          - entity: number.opentherm_thermostat_hot_water_setpoint

      - type: glance
        title: Boiler status
        entities:
          - entity: binary_sensor.opentherm_thermostat_flame_on
            name: Flame
          - entity: binary_sensor.opentherm_thermostat_heating_active
            name: Heating
          - entity: binary_sensor.opentherm_thermostat_hot_water_active
            name: Hot water
          - entity: binary_sensor.opentherm_thermostat_condensing_mode_active
            name: Condensing

      - type: history-graph
        title: Setpoint vs. actual flow vs. return temperature
        hours_to_show: 24
        entities:
          - entity: sensor.opentherm_thermostat_ch_setpoint
            name: Setpoint (commanded)
          - entity: sensor.opentherm_thermostat_boiler_flow_temperature
            name: Flow (measured)
          - entity: sensor.opentherm_thermostat_cv_return_line_temperature
            name: Return (external sensor — the boiler doesn't report its own)

      - type: entities
        title: Backup & diagnostics
        show_header_toggle: false
        entities:
          - entity: binary_sensor.opentherm_thermostat_home_assistant_connected
          - entity: binary_sensor.opentherm_thermostat_backup_mode_active
          - entity: binary_sensor.opentherm_thermostat_boiler_fault
          - entity: sensor.opentherm_thermostat_ch_water_pressure
          - entity: sensor.opentherm_thermostat_wifi_signal
