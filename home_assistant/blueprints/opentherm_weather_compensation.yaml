blueprint:
  name: OpenTherm Weather Compensation (Gas-Saving Heating Curve)
  description: >
    Drives an ESPHome OpenTherm CH flow setpoint from an outdoor-temperature
    heating curve instead of room-thermostat on/off cycling. This is the
    correct control strategy for a modulating condensing boiler (e.g.
    Intergas 28/24 cW4): it keeps the boiler modulating at the lowest flow
    temperature that still heats the house, which maximizes condensing
    efficiency and minimizes gas usage.

    Optional extras: a small room-temperature trim, a return-line
    condensing clamp (trims the setpoint down if the CV return line runs
    hotter than your condensing threshold), open-window cutoff, presence
    based eco setback, and a night setback window.

    Pairs with the opentherm-thermostat.yaml ESPHome firmware in this repo,
    which exposes number.<...>_heating_flow_setpoint, switch.<...>_central_heating
    and sensor.<...>_cv_return_line_temperature.
  domain: automation
  source_url: https://github.com/jkautomation01/ESPHome-opentherm

  input:
    ch_setpoint_entity:
      name: CH Flow Setpoint (number)
      description: The ESPHome "Heating Flow Setpoint" number entity.
      selector:
        entity:
          domain: number

    ch_enable_entity:
      name: Central Heating (switch)
      description: The ESPHome "Central Heating" switch entity.
      selector:
        entity:
          domain: switch

    outdoor_temp_entity:
      name: Outdoor temperature sensor
      description: A weather integration or local outdoor sensor.
      selector:
        entity:
          domain: sensor
          device_class: temperature

    return_temp_entity:
      name: CV return line temperature sensor
      description: The ESPHome "CV Return Line Temperature" sensor (external DS18B20).
      selector:
        entity:
          domain: sensor
          device_class: temperature

    room_temp_entity:
      name: (Optional) Room temperature sensor
      description: Used only for a small comfort trim on top of the curve. Leave blank to run pure weather compensation.
      default: ""
      selector:
        entity:
          domain: sensor
          device_class: temperature

    room_target_temp:
      name: (Optional) Room target temperature helper (input_number, °C)
      default: ""
      selector:
        entity:
          domain: input_number

    room_trim_factor:
      name: Room trim factor (°C flow per °C room error)
      description: 0 disables room trim entirely (pure weather compensation). 2-4 gives gentle comfort correction.
      default: 0
      selector:
        number:
          min: 0
          max: 8
          step: 0.5

    window_sensor_entities:
      name: (Optional) Window/door open sensors
      description: If any of these are open, central heating is switched off until they all close.
      default: []
      selector:
        entity:
          domain: binary_sensor
          multiple: true

    presence_entities:
      name: (Optional) Presence entities
      description: If provided and everyone is away, an extra eco setback is applied to the curve.
      default: []
      selector:
        entity:
          multiple: true

    eco_setback_amount:
      name: Away eco setback (°C subtracted from flow setpoint)
      default: 5
      selector:
        number:
          min: 0
          max: 20
          step: 0.5

    night_setback_start:
      name: Night setback start time
      default: "22:30:00"
      selector:
        time: {}

    night_setback_end:
      name: Night setback end time
      default: "06:00:00"
      selector:
        time: {}

    night_setback_amount:
      name: Night setback amount (°C subtracted from flow setpoint)
      default: 3
      selector:
        number:
          min: 0
          max: 20
          step: 0.5

    design_outdoor_temp:
      name: Design outdoor temperature (°C)
      description: The coldest outdoor temperature you size the curve for (NL design temp is typically around -10°C).
      default: -10
      selector:
        number:
          min: -30
          max: 10
          step: 1

    design_flow_temp:
      name: Flow setpoint at design outdoor temperature (°C)
      description: Also used as the curve's maximum flow setpoint. Keep as low as your radiators/floor heating allow.
      default: 65
      selector:
        number:
          min: 30
          max: 90
          step: 1

    heating_limit_outdoor_temp:
      name: Heating limit outdoor temperature (°C)
      description: Above this outdoor temperature, no heat is needed and central heating is switched off.
      default: 18
      selector:
        number:
          min: 5
          max: 25
          step: 0.5

    min_flow_temp:
      name: Minimum flow setpoint (°C)
      description: Curve floor — the lowest setpoint ever sent while heating is on.
      default: 22
      selector:
        number:
          min: 15
          max: 40
          step: 1

    condensing_max_return_temp:
      name: Condensing clamp — max return temperature (°C)
      description: If the CV return line runs hotter than this, the flow setpoint is trimmed down to push the boiler back into its condensing range.
      default: 55
      selector:
        number:
          min: 30
          max: 70
          step: 1

    condensing_trim_step:
      name: Condensing clamp trim step (°C)
      default: 2
      selector:
        number:
          min: 0
          max: 10
          step: 0.5

    update_interval:
      name: Recalculation interval (minutes)
      default: 10
      selector:
        number:
          min: 2
          max: 60
          step: 1

trigger:
  - platform: time_pattern
    minutes: !input update_interval
  - platform: state
    entity_id: !input window_sensor_entities

condition: []

action:
  - variables:
      outdoor_temp_entity: !input outdoor_temp_entity
      return_temp_entity: !input return_temp_entity
      room_temp_entity: !input room_temp_entity
      room_target_temp: !input room_target_temp
      room_trim_factor: !input room_trim_factor
      window_sensor_entities: !input window_sensor_entities
      presence_entities: !input presence_entities
      eco_setback_amount: !input eco_setback_amount
      night_setback_start: !input night_setback_start
      night_setback_end: !input night_setback_end
      night_setback_amount: !input night_setback_amount
      design_outdoor_temp: !input design_outdoor_temp
      design_flow_temp: !input design_flow_temp
      heating_limit_outdoor_temp: !input heating_limit_outdoor_temp
      min_flow_temp: !input min_flow_temp
      condensing_max_return_temp: !input condensing_max_return_temp
      condensing_trim_step: !input condensing_trim_step

      outdoor_temp: "{{ states(outdoor_temp_entity) | float(10) }}"
      return_temp: "{{ states(return_temp_entity) | float(0) }}"

      any_window_open: >-
        {{ window_sensor_entities | select('is_state', 'on') | list | count > 0 }}

      all_away: >-
        {{ presence_entities | length > 0 and
           presence_entities | select('is_state', 'home') | list | count == 0 }}

      in_night_window: >-
        {{ now().strftime('%H:%M:%S') >= night_setback_start and now().strftime('%H:%M:%S') < night_setback_end
           if night_setback_start < night_setback_end else
           (now().strftime('%H:%M:%S') >= night_setback_start or now().strftime('%H:%M:%S') < night_setback_end) }}

      curve_span: "{{ heating_limit_outdoor_temp - design_outdoor_temp }}"
      curve_ratio: >-
        {{ ((heating_limit_outdoor_temp - outdoor_temp) / curve_span) if curve_span != 0 else 0 }}
      curve_ratio_clamped: "{{ [ [curve_ratio, 0] | max, 1] | min }}"
      base_flow: "{{ min_flow_temp + curve_ratio_clamped * (design_flow_temp - min_flow_temp) }}"

      room_trim: >-
        {% if room_temp_entity and room_target_temp %}
          {{ room_trim_factor | float(0) * (states(room_target_temp) | float(20) - states(room_temp_entity) | float(20)) }}
        {% else %}
          0
        {% endif %}

      condensing_trim: >-
        {{ condensing_trim_step if return_temp > condensing_max_return_temp else 0 }}

      away_trim: "{{ eco_setback_amount if all_away else 0 }}"
      night_trim: "{{ night_setback_amount if in_night_window else 0 }}"

      target_flow: >-
        {{ [ [base_flow + room_trim - condensing_trim - away_trim - night_trim, min_flow_temp] | max, design_flow_temp ] | min }}

      heating_needed: "{{ outdoor_temp < heating_limit_outdoor_temp and not any_window_open }}"

  - choose:
      - conditions: "{{ any_window_open }}"
        sequence:
          - service: switch.turn_off
            target:
              entity_id: !input ch_enable_entity
          - service: logbook.log
            data:
              name: OpenTherm Weather Compensation
              message: "Window/door open — central heating switched off."

      - conditions: "{{ not heating_needed }}"
        sequence:
          - service: switch.turn_off
            target:
              entity_id: !input ch_enable_entity

    default:
      - service: switch.turn_on
        target:
          entity_id: !input ch_enable_entity
      - service: number.set_value
        target:
          entity_id: !input ch_setpoint_entity
        data:
          value: "{{ target_flow | round(1) }}"
      - service: logbook.log
        data:
          name: OpenTherm Weather Compensation
          message: >-
            Outdoor {{ outdoor_temp }}°C -> flow {{ target_flow | round(1) }}°C
            (base {{ base_flow | round(1) }}, room_trim {{ room_trim | round(1) }},
            condensing_trim {{ condensing_trim }}, away_trim {{ away_trim }},
            night_trim {{ night_trim }}, return {{ return_temp }}°C)

mode: single
max_exceeded: silent
