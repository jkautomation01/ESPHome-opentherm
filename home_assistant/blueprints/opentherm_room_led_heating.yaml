blueprint:
  name: OpenTherm Room-Led Heating (Weather-Compensated Bounds)
  description: >
    Controls an ESPHome OpenTherm CH flow setpoint from your room
    temperature (room-led, PI control), while an outdoor-temperature
    weather curve sets the min/max bounds the setpoint is allowed to move
    within on each cycle. This gives you normal thermostat behaviour
    (respond to actual room temperature) while still keeping the boiler
    running at the lowest flow temperature the outdoor conditions allow —
    which is what keeps a modulating condensing boiler (e.g. Intergas
    28/24 cW4) in its efficient condensing range instead of firing at a
    high, wasteful flow temperature.

    The weather curve acts purely as a feed-forward starting point + hard
    ceiling/floor. The room sensor's error drives a proportional+integral
    correction on top of it. A return-line temperature sensor further
    trims the setpoint down if the boiler isn't actually condensing.

    Pairs with:
      - opentherm-thermostat.yaml (this repo) for the ESPHome device
      - home_assistant/opentherm_room_climate.yaml for the thermostat
        card and the helpers this blueprint reads/writes
        (input_number.opentherm_room_target_temp,
        input_boolean.opentherm_heat_mode_requested,
        input_number.opentherm_pi_integral)
  domain: automation
  source_url: https://github.com/jkautomation01/ESPHome-opentherm

  input:
    room_temp_entity:
      name: Room temperature sensor
      selector:
        entity:
          domain: sensor
          device_class: temperature

    room_target_entity:
      name: Room target temperature helper
      description: input_number.opentherm_room_target_temp from opentherm_room_climate.yaml.
      selector:
        entity:
          domain: input_number

    heat_mode_entity:
      name: Heat mode requested helper
      description: input_boolean.opentherm_heat_mode_requested from opentherm_room_climate.yaml.
      selector:
        entity:
          domain: input_boolean

    integral_helper_entity:
      name: PI integral storage helper
      description: input_number.opentherm_pi_integral from opentherm_room_climate.yaml.
      selector:
        entity:
          domain: input_number

    ch_setpoint_entity:
      name: CH Flow Setpoint (number)
      description: The ESPHome "Heating Flow Setpoint" number entity.
      selector:
        entity:
          domain: number

    ch_enable_entity:
      name: Central Heating (switch)
      description: The ESPHome "Central Heating" switch entity.
      selector:
        entity:
          domain: switch

    outdoor_temp_entity:
      name: Outdoor temperature sensor
      selector:
        entity:
          domain: sensor
          device_class: temperature

    return_temp_entity:
      name: CV return line temperature sensor
      description: The ESPHome "CV Return Line Temperature" sensor (external DS18B20).
      selector:
        entity:
          domain: sensor
          device_class: temperature

    kp:
      name: Proportional gain (°C flow per °C room error)
      default: 4
      selector:
        number:
          min: 0
          max: 15
          step: 0.5

    ki:
      name: Integral gain (°C flow per °C·hour accumulated error)
      description: Set to 0 for pure proportional (feed-forward + P) control.
      default: 1.5
      selector:
        number:
          min: 0
          max: 10
          step: 0.1

    integral_limit:
      name: Integral term limit (°C, anti-windup)
      default: 8
      selector:
        number:
          min: 0
          max: 20
          step: 1

    window_sensor_entities:
      name: (Optional) Window/door open sensors
      description: If any of these are open, central heating is switched off (integral is reset) until they all close.
      default: []
      selector:
        entity:
          domain: binary_sensor
          multiple: true

    presence_entities:
      name: (Optional) Presence entities
      description: If provided and everyone is away, an extra setback is subtracted from the room target temperature.
      default: []
      selector:
        entity:
          multiple: true

    eco_setback_amount:
      name: Away eco setback (°C subtracted from room target)
      default: 3
      selector:
        number:
          min: 0
          max: 10
          step: 0.5

    night_setback_start:
      name: Night setback start time
      default: "22:30:00"
      selector:
        time: {}

    night_setback_end:
      name: Night setback end time
      default: "06:00:00"
      selector:
        time: {}

    night_setback_amount:
      name: Night setback amount (°C subtracted from room target)
      default: 2
      selector:
        number:
          min: 0
          max: 10
          step: 0.5

    design_outdoor_temp:
      name: Design outdoor temperature (°C)
      description: The coldest outdoor temperature you size the curve for (NL design temp is typically around -10°C).
      default: -10
      selector:
        number:
          min: -30
          max: 10
          step: 1

    design_flow_temp:
      name: Flow setpoint at design outdoor temperature (°C)
      description: Also the loop's maximum flow setpoint ceiling. Keep as low as your radiators/floor heating allow.
      default: 65
      selector:
        number:
          min: 30
          max: 90
          step: 1

    heating_limit_outdoor_temp:
      name: Heating limit outdoor temperature (°C)
      description: Above this outdoor temperature, the feed-forward base drops to the curve floor (heating still runs if the room actually calls for it, just at low flow temp).
      default: 18
      selector:
        number:
          min: 5
          max: 25
          step: 0.5

    min_flow_temp:
      name: Minimum flow setpoint (°C)
      description: Loop floor — the lowest setpoint ever sent while heating is on.
      default: 22
      selector:
        number:
          min: 15
          max: 40
          step: 1

    condensing_max_return_temp:
      name: Condensing clamp — max return temperature (°C)
      description: If the CV return line runs hotter than this, the flow setpoint is trimmed down to push the boiler back into its condensing range.
      default: 55
      selector:
        number:
          min: 30
          max: 70
          step: 1

    condensing_trim_step:
      name: Condensing clamp trim step (°C)
      default: 2
      selector:
        number:
          min: 0
          max: 10
          step: 0.5

    update_interval:
      name: Recalculation interval (minutes)
      description: Also the time base for the integral term. 5 minutes is a reasonable default for a modulating boiler.
      default: 5
      selector:
        number:
          min: 2
          max: 30
          step: 1

trigger:
  - platform: time_pattern
    minutes: !input update_interval
  - platform: state
    entity_id: !input window_sensor_entities
  - platform: state
    entity_id: !input heat_mode_entity

condition: []

action:
  - variables:
      room_temp_entity: !input room_temp_entity
      room_target_entity: !input room_target_entity
      heat_mode_entity: !input heat_mode_entity
      integral_helper_entity: !input integral_helper_entity
      outdoor_temp_entity: !input outdoor_temp_entity
      return_temp_entity: !input return_temp_entity
      window_sensor_entities: !input window_sensor_entities
      presence_entities: !input presence_entities
      eco_setback_amount: !input eco_setback_amount
      night_setback_start: !input night_setback_start
      night_setback_end: !input night_setback_end
      night_setback_amount: !input night_setback_amount
      design_outdoor_temp: !input design_outdoor_temp
      design_flow_temp: !input design_flow_temp
      heating_limit_outdoor_temp: !input heating_limit_outdoor_temp
      min_flow_temp: !input min_flow_temp
      condensing_max_return_temp: !input condensing_max_return_temp
      condensing_trim_step: !input condensing_trim_step
      kp: !input kp
      ki: !input ki
      integral_limit: !input integral_limit
      update_interval: !input update_interval

      room_temp: "{{ states(room_temp_entity) | float(20) }}"
      outdoor_temp: "{{ states(outdoor_temp_entity) | float(10) }}"
      return_temp: "{{ states(return_temp_entity) | float(0) }}"
      room_target_raw: "{{ states(room_target_entity) | float(20) }}"
      previous_integral: "{{ states(integral_helper_entity) | float(0) }}"
      heat_requested: "{{ is_state(heat_mode_entity, 'on') }}"

      any_window_open: >-
        {{ window_sensor_entities | select('is_state', 'on') | list | count > 0 }}

      all_away: >-
        {{ presence_entities | length > 0 and
           presence_entities | select('is_state', 'home') | list | count == 0 }}

      in_night_window: >-
        {{ now().strftime('%H:%M:%S') >= night_setback_start and now().strftime('%H:%M:%S') < night_setback_end
           if night_setback_start < night_setback_end else
           (now().strftime('%H:%M:%S') >= night_setback_start or now().strftime('%H:%M:%S') < night_setback_end) }}

      effective_target: >-
        {{ [room_target_raw - (eco_setback_amount if all_away else 0) - (night_setback_amount if in_night_window else 0), 10] | max }}

      room_error: "{{ effective_target - room_temp }}"

      curve_span: "{{ heating_limit_outdoor_temp - design_outdoor_temp }}"
      curve_ratio: >-
        {{ ((heating_limit_outdoor_temp - outdoor_temp) / curve_span) if curve_span != 0 else 0 }}
      curve_ratio_clamped: "{{ [ [curve_ratio, 0] | max, 1] | min }}"
      base_feedforward: "{{ min_flow_temp + curve_ratio_clamped * (design_flow_temp - min_flow_temp) }}"

  - choose:
      - conditions: "{{ not heat_requested }}"
        sequence:
          - service: switch.turn_off
            target:
              entity_id: !input ch_enable_entity
          - service: input_number.set_value
            target:
              entity_id: !input integral_helper_entity
            data:
              value: 0

      - conditions: "{{ any_window_open }}"
        sequence:
          - service: switch.turn_off
            target:
              entity_id: !input ch_enable_entity
          - service: input_number.set_value
            target:
              entity_id: !input integral_helper_entity
            data:
              value: 0
          - service: logbook.log
            data:
              name: OpenTherm Room-Led Heating
              message: "Window/door open — central heating switched off, integral reset."

    default:
      - variables:
          new_integral: >-
            {{ [ [previous_integral + ki * room_error * (update_interval / 60), -integral_limit] | max, integral_limit] | min }}
      - service: input_number.set_value
        target:
          entity_id: !input integral_helper_entity
        data:
          value: "{{ new_integral }}"
      - variables:
          condensing_trim: "{{ condensing_trim_step if return_temp > condensing_max_return_temp else 0 }}"
          target_flow_raw: "{{ base_feedforward + kp * room_error + new_integral - condensing_trim }}"
          target_flow: >-
            {{ [ [target_flow_raw, min_flow_temp] | max, design_flow_temp] | min }}
          target_flow_snapped: "{{ (target_flow * 2) | round(0) / 2 }}"
      - service: switch.turn_on
        target:
          entity_id: !input ch_enable_entity
      - service: number.set_value
        target:
          entity_id: !input ch_setpoint_entity
        data:
          value: "{{ target_flow_snapped }}"
      - service: logbook.log
        data:
          name: OpenTherm Room-Led Heating
          message: >-
            Room {{ room_temp }}°C -> target {{ effective_target | round(1) }}°C
            (error {{ room_error | round(2) }}) -> flow {{ target_flow_snapped }}°C
            (feedforward {{ base_feedforward | round(1) }}, integral {{ new_integral | round(2) }},
            condensing_trim {{ condensing_trim }}, return {{ return_temp }}°C, outdoor {{ outdoor_temp }}°C)

mode: single
max_exceeded: silent
