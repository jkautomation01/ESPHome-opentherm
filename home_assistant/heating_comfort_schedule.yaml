# Preheat Schedule dependency for the OpenTherm thermostat firmware.
#
# 1. Create the schedule helper itself in the Home Assistant UI —
#    Settings → Devices & Services → Helpers → Add Helper → Schedule —
#    named "Heating Comfort" so it lands at entity_id
#    schedule.heating_comfort (the entity_id opentherm-thermostat.yaml
#    imports). Edit its weekly Comfort blocks there; everything outside
#    a block is Setback. This step can't be done via YAML — helpers are
#    stored in Home Assistant's own config storage, not a config file.
#
# 2. Paste the template sensor below into a file under your `template:`
#    include (e.g. this HA install's own templates/ package directory,
#    included via `template: !include_dir_merge_list templates`), or
#    inline it under your existing `template:` key in configuration.yaml.
#    It precomputes "minutes until the next Comfort block starts" from
#    the schedule helper's next_event attribute, so the ESP32 firmware
#    only has to import a plain number instead of parsing an ISO-8601
#    datetime string itself.
#
# After adding, call the `template.reload` service (or restart Home
# Assistant) to pick it up, then confirm sensor.heating_comfort_minutes_to_start
# actually populates before relying on it — the Preheat Schedule feature
# degrades to "always Setback" (not an error, just no preheat) if either
# entity referenced here is missing or unavailable.

- sensor:
    - name: "Heating Comfort Minutes To Start"
      unique_id: heating_comfort_minutes_to_start
      unit_of_measurement: "min"
      state: >
        {% set sched = 'schedule.heating_comfort' %}
        {% set next_event = state_attr(sched, 'next_event') %}
        {% if is_state(sched, 'off') and next_event %}
          {{ ((as_timestamp(next_event) - as_timestamp(now())) / 60) | round(1) }}
        {% else %}
          -1
        {% endif %}
      availability: "{{ has_value('schedule.heating_comfort') }}"
